name: Audit accuracy problem
description: Report a false positive, false negative, unsafe recommendation, or misleading audit conclusion
title: "[audit] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This form is for the diagnostic contract itself, not general Windows support.
        Please provide evidence for the disputed conclusion. Event IDs alone are clues,
        not diagnoses. **Sanitize all public evidence before posting.**

  - type: dropdown
    id: kind
    attributes:
      label: Problem type
      options:
        - False positive
        - False negative / missed problem
        - Unsafe or unjustified repair recommendation
        - Incorrect confidence / certainty
        - Incorrect target attestation
        - Incorrect UNKNOWN / unsupported conclusion handling
        - Other audit-methodology problem
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "v0.2.1 or commit SHA"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version and architecture
      placeholder: "Windows 11 Pro 25H2, build 26200.xxxx, x64"
    validations:
      required: true

  - type: textarea
    id: attestation
    attributes:
      label: Target attestation
      description: Paste the relevant sanitized attestation fields proving which machine was audited.
      render: text
    validations:
      required: true

  - type: textarea
    id: finding
    attributes:
      label: Disputed finding or missing finding
      description: Quote or summarize the specific conclusion/recommendation you believe is wrong.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Provide the smallest relevant sanitized evidence set that supports your claim.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected conclusion
      description: What should the audit have concluded, and why?
    validations:
      required: true

  - type: input
    id: collection
    attributes:
      label: Collection mode
      placeholder: "Fast, EventDays 14, default caps, -Redact"

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed the pasted evidence and removed secrets and unnecessary personal/device identifiers.
          required: true
